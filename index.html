function drawWorld(){const g=ctx;g.fillStyle='#070909';g.fillRect(0,0,W,H);let horizon=H*.50;let sec=sectorAt(player.x,player.y),colors=[['#242624','#101313','#151716'],['#30302b','#101211','#181916'],['#252d2a','#0d1414','#171c1b'],['#292825','#111312','#1a1917'],['#242622','#101211','#161817']][sec]||['#252625','#111312','#191a18'];let sky=g.createLinearGradient(0,0,0,horizon);sky.addColorStop(0,'#030505');sky.addColorStop(1,colors[0]);g.fillStyle=sky;g.fillRect(0,0,W,horizon);let floor=g.createLinearGradient(0,horizon,0,H);floor.addColorStop(0,colors[1]);floor.addColorStop(1,'#020303');g.fillStyle=floor;g.fillRect(0,horizon,W,H-horizon);
